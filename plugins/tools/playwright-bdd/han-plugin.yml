hooks:
  generate:
    command: 'bash "${CLAUDE_PLUGIN_ROOT}/scripts/generate.sh"'
    dirs_with:
      - "playwright.bdd.config.ts"
      - "playwright.bdd.config.js"
      - "playwright.config.ts"
      - "playwright.config.js"
    # Keep this a plain single-line scalar for bridge discovery.
    dir_test: node -e 'const fs = require("node:fs"), path = require("node:path"); let dir = process.cwd(); for (;;) { const file = path.join(dir, "package.json"); if (fs.existsSync(file)) { try { const pkg = JSON.parse(fs.readFileSync(file, "utf8")); process.exit(Object.hasOwn(pkg.dependencies || {}, "playwright-bdd") || Object.hasOwn(pkg.devDependencies || {}, "playwright-bdd") ? 0 :1); } catch { process.exit(1); } } const parent = path.dirname(dir); if (parent === dir) process.exit(1); dir = parent; }';
    if_changed:
      - "**/*.feature"
      - "**/steps/**/*.ts"
      - "**/steps/**/*.js"
      - "playwright.config.*"
      - "playwright.bdd.config.*"
      - "**/package.json"
