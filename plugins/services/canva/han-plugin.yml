# canva plugin configuration
# This plugin provides Canva integration via MCP server
# MCP server is defined in .mcp.json for direct exposure to Claude Code

# No hooks - MCP server plugins don't have validation hooks
hooks: {}

# Mirrors .mcp.json so han and Claude Code see the same server definition
mcp_servers:
  canva:
    type: http
    url: https://mcp.canva.com/mcp
