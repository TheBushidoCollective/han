title: Han Terraform plan, secrets
description: Read secret metadata and version metadata for Han's secrets, so Terraform can refresh them. Read-only. No payload access, no IAM write, and bound with the same han-server- name condition.
stage: GA
includedPermissions:
- secretmanager.secrets.get
- secretmanager.secrets.getIamPolicy
- secretmanager.versions.get
- secretmanager.versions.list
