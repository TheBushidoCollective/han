title: Han Terraform plan, secrets
description: Read the metadata and version list of the two Han secrets Terraform manages, jwt-secret and master-kek, so it can refresh them. Bound per secret, on those two only. Read-only. No payload access and no IAM read or write.
stage: GA
includedPermissions:
- secretmanager.secrets.get
- secretmanager.versions.get
- secretmanager.versions.list
