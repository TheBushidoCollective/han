title: Han Terraform apply, secrets
description: Write versions of the two Han secrets Terraform manages, jwt-secret and master-kek, bound per secret on those two only. Never at project level. It cannot create or delete a secret, cannot change any secret's IAM, and has no secretmanager.versions.access, so it cannot read any payload. database-url is not Terraform's: the bootstrap writes it.
stage: GA
includedPermissions:
- secretmanager.secrets.get
- secretmanager.versions.add
- secretmanager.versions.get
- secretmanager.versions.list
- secretmanager.versions.enable
- secretmanager.versions.disable
- secretmanager.versions.destroy
