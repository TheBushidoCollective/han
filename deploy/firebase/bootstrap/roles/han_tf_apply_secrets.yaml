title: Han Terraform apply, secrets
description: Write versions of the three Han secrets Terraform manages (database-url, jwt-secret, master-kek). Bound per secret, on those three secrets only, never at project level. It cannot create or delete a secret, cannot change any secret's IAM, and has no secretmanager.versions.access, so it cannot read any payload.
stage: GA
includedPermissions:
- secretmanager.secrets.get
- secretmanager.versions.add
- secretmanager.versions.get
- secretmanager.versions.list
- secretmanager.versions.enable
- secretmanager.versions.disable
- secretmanager.versions.destroy
