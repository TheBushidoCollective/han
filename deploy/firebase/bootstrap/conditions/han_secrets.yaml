title: han-secrets-only
description: Limits a Han apply or plan role to Han's own secrets (names starting han-server-). Passed to gcloud with --condition-from-file, because the expression contains commas.
expression: "resource.type in ['secretmanager.googleapis.com/Secret','secretmanager.googleapis.com/SecretVersion'] && resource.name.startsWith('projects/911514101920/secrets/han-server-')"
