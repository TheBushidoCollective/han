name: Han Infrastructure

# Plans and applies deploy/firebase/terraform through CI only. Nobody applies
# it from a workstation.
#
# - Pull request (terraform paths): plan as han-tf-plan. No state lock, no
#   environment, so a pull request can never reach the apply identity.
# - Push to main: plan as han-tf-plan when Terraform changed. Apply the saved
#   plan as han-tf-apply inside the han-production environment.
#
# This workflow runs on every push to main, without a path filter, so that the
# deploy workflows can wait for it with workflow_run. The plan and apply jobs
# are skipped when Terraform did not change, and a skipped job is not a failure.
#
# Deletes and replacements fail unless their address is in the allowlist below.
# The list is empty until slice L.

on:
  pull_request:
    paths:
      - "deploy/firebase/terraform/**"
      - "deploy/firebase/scripts/**"
      - ".github/workflows/han-infra.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('han-infra-pr-{0}', github.event.number) || 'han-infra-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_VAR_project_id: ${{ vars.HAN_GCP_PROJECT_ID }}
  TF_VAR_github_repository: ${{ github.repository }}
  TERRAFORM_VERSION: 1.15.8
  # Reviewed destroy/replace exceptions, one resource address per entry. Empty
  # until slice L.
  DESTROY_ALLOWLIST: ""

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.diff.outputs.terraform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            # The paths filter already limited this run to Terraform changes.
            echo "terraform=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # First push, or a force push with no usable base: treat as changed.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] ||
             ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "terraform=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BEFORE" "$SHA" | grep -q '^deploy/firebase/\(terraform\|scripts\)/'; then
            echo "terraform=true" >> "$GITHUB_OUTPUT"
          else
            echo "terraform=false" >> "$GITHUB_OUTPUT"
          fi

  plan:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: deploy/firebase/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.HAN_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.HAN_GCP_TF_PLAN_SA }}

      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.HAN_GCP_PROJECT_ID }}-tfstate" \
            -backend-config="prefix=terraform/han"

      - name: Format and validate
        run: |
          terraform fmt -check -recursive
          terraform validate

      - name: Plan
        run: terraform plan -input=false -lock=false -no-color -out=tfplan

      - name: Refuse unexpected deletes
        run: |
          set -euo pipefail
          terraform show -json tfplan > plan.json
          # shellcheck disable=SC2086
          python3 ../scripts/plan_guard.py plan.json $DESTROY_ALLOWLIST

      - name: Upload plan
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: han-tfplan
          path: deploy/firebase/terraform/tfplan
          retention-days: 7

  apply:
    needs: [changes, plan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: han-production
    defaults:
      run:
        working-directory: deploy/firebase/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.HAN_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.HAN_GCP_TF_APPLY_SA }}

      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.HAN_GCP_PROJECT_ID }}-tfstate" \
            -backend-config="prefix=terraform/han"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: han-tfplan
          path: deploy/firebase/terraform

      - name: Refuse unexpected deletes in the saved plan
        run: |
          set -euo pipefail
          terraform show -json tfplan > plan.json
          # shellcheck disable=SC2086
          python3 ../scripts/plan_guard.py plan.json $DESTROY_ALLOWLIST

      - name: Apply saved plan
        run: terraform apply -input=false -no-color tfplan

      - name: No secret values in state
        run: |
          set -euo pipefail
          terraform show -json > state.json
          python3 ../scripts/state_guard.py state.json

      - name: No drift after apply
        run: terraform plan -input=false -no-color -detailed-exitcode
