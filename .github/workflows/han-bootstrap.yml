name: Han Bootstrap

# Register one exact execution before a dedicated, time-limited WIF route is
# provisioned by the reviewed website rail. No shared-pool bootstrap grant.
# The plan is validated before registration; apply waits for the dedicated
# route without requesting human approval, then revalidates before mutations.

on:
  workflow_dispatch:
    inputs:
      expected_sha256:
        description: "plan-sha256 printed by the plan job of a run of this commit. Execution refuses any other plan."
        required: true
        type: string
      expected_commit:
        description: "The commit this plan was computed from. Execution refuses any other commit."
        required: true
        type: string
      website_commit:
        description: "Reviewed website main commit used by the provisioning rail."
        required: true
        type: string
      deadline:
        description: "Approved execution deadline in UTC, YYYY-MM-DDTHH:MM:SSZ."
        required: true
        type: string
      rotate_db_password:
        description: "Generate a new database password and reseed database-url. Changes the plan, so the expected hash must come from a plan run with this set to true. Leave false on a normal run."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: han-bootstrap
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      WEBSITE_COMMIT: ${{ inputs.website_commit }}
      EXECUTION_DEADLINE: ${{ inputs.deadline }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Print the plan and check the hash and commit
        env:
          ROTATE_FLAG: ${{ inputs.rotate_db_password && '--rotate-db-password' || '' }}
        run: |
          rotate=()
          if [ -n "$ROTATE_FLAG" ]; then rotate=("$ROTATE_FLAG"); fi
          python3 -I -B deploy/firebase/bootstrap/bootstrap.py \
            --expect-sha256 "$EXPECTED_SHA256" \
            --expect-commit "$EXPECTED_COMMIT" \
            "${rotate[@]}" \
            --plan-file bootstrap-plan.txt

      - name: Upload the plan for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: han-bootstrap-plan
          path: bootstrap-plan.txt
          retention-days: 7

      - name: Register exact execution
        env:
          ROTATE_FLAG: ${{ inputs.rotate_db_password && '--rotate' || '' }}
        run: |
          rotate=()
          if [ -n "$ROTATE_FLAG" ]; then rotate=("$ROTATE_FLAG"); fi
          python3 -I -B deploy/firebase/bootstrap/execution.py register \
            --manifest registration.json --commit "$EXPECTED_COMMIT" --plan "$EXPECTED_SHA256" \
            --website "$WEBSITE_COMMIT" --deadline "$EXECUTION_DEADLINE" "${rotate[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: han-bootstrap-registration-${{ github.run_id }}-${{ github.run_attempt }}
          path: registration.json
          retention-days: 7
          if-no-files-found: error

  apply:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    environment:
      name: han-bootstrap
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download execution registration
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: han-bootstrap-registration-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Capture allowlisted assertion metadata
        run: python3 -I -B deploy/firebase/bootstrap/execution.py inspect --manifest registration.json --claims-file claims.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: han-bootstrap-claims-${{ github.run_id }}-${{ github.run_attempt }}
          path: claims.json
          retention-days: 7
          if-no-files-found: error
      - name: Wait for exact execution federation
        id: ready
        run: |
          python3 -I -B deploy/firebase/bootstrap/execution.py ready --manifest registration.json
          python3 -c 'import json; m=json.load(open("registration.json")); print("provider="+m["provider_resource"]); print("audience="+m["audience"])' >> "$GITHUB_OUTPUT"
      - name: Authenticate using the registered execution provider
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ steps.ready.outputs.provider }}
          audience: ${{ steps.ready.outputs.audience }}
          service_account: terraform-bootstrap@thebushido-co.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          version: "580.0.0"

      - id: execute
        name: Execute the approved plan
        # Reserve job time for the fallback revoke if execution times out.
        timeout-minutes: 35
        env:
          ROTATE_FLAG: ${{ inputs.rotate_db_password && '--rotate-db-password' || '' }}
        run: |
          rotate=()
          if [ -n "$ROTATE_FLAG" ]; then rotate=("$ROTATE_FLAG"); fi
          python3 -I -B deploy/firebase/bootstrap/bootstrap.py \
            --execute \
            --expect-sha256 "$EXPECTED_SHA256" \
            --expect-commit "$EXPECTED_COMMIT" \
            --execution-manifest registration.json \
            "${rotate[@]}"

      - name: Revoke the sign-in (only when the execute step did not succeed)
        # The execute step revokes in its own process on success and on failure, and
        # its token is already spent. This step covers a run that died before it could,
        # and it is skipped after a clean execute, so a finished run cannot turn red here.
        if: always() && steps.auth.outcome == 'success' && steps.execute.outcome != 'success'
        env:
          ROTATE_FLAG: ${{ inputs.rotate_db_password && '--rotate-db-password' || '' }}
        run: |
          rotate=()
          if [ -n "$ROTATE_FLAG" ]; then rotate=("$ROTATE_FLAG"); fi
          python3 -I -B deploy/firebase/bootstrap/bootstrap.py --revoke-only \
            --expect-sha256 "$EXPECTED_SHA256" --expect-commit "$EXPECTED_COMMIT" --execution-manifest registration.json \
            "${rotate[@]}"
