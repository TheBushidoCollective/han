name: Han Bootstrap

# The one-shot bootstrap for Han inside thebushido-co. It runs from CI only, and
# nothing else calls it. Two jobs, in order:
#
# - plan: no environment, no sign-in, no owner token. Prints the plan and its
#   sha256, checks both the hash and the commit against the dispatch inputs, and
#   uploads the plan text. The reviewer reads it here, before anything can be approved.
# - apply: waits for approval in the han-bootstrap environment (required
#   reviewer, deployment from main only). Signs in as terraform-bootstrap, and
#   runs only the plan whose hash and commit were dispatched. If the run's own
#   execute step did not succeed, a last step removes the sign-in member.
#
# The sign-in grant must be created through the separately reviewed CI rail
# (PATH.md section 8), with an expiry and environment protections in place.

on:
  workflow_dispatch:
    inputs:
      expected_sha256:
        description: "plan-sha256 printed by the plan job of a run of this commit. Execution refuses any other plan."
        required: true
        type: string
      expected_commit:
        description: "The commit this plan was computed from. Execution refuses any other commit."
        required: true
        type: string
      rotate_db_password:
        description: "Generate a new database password and reseed database-url. Changes the plan, so the expected hash must come from a plan run with this set to true. Leave false on a normal run."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: han-bootstrap
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Print the plan and check the hash and commit
        env:
          ROTATE_FLAG: ${{ inputs.rotate_db_password && '--rotate-db-password' || '' }}
        run: |
          rotate=()
          if [ -n "$ROTATE_FLAG" ]; then rotate=("$ROTATE_FLAG"); fi
          python3 -I -B deploy/firebase/bootstrap/bootstrap.py \
            --expect-sha256 "$EXPECTED_SHA256" \
            --expect-commit "$EXPECTED_COMMIT" \
            "${rotate[@]}" \
            --plan-file bootstrap-plan.txt

      - name: Upload the plan for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: han-bootstrap-plan
          path: bootstrap-plan.txt
          retention-days: 7

  apply:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: han-bootstrap
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Authenticate to Google Cloud (WIF, existing github pool, bootstrap identity)
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/911514101920/locations/global/workloadIdentityPools/github/providers/github
          service_account: terraform-bootstrap@thebushido-co.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          version: "580.0.0"

      - id: execute
        name: Execute the approved plan
        # Reserve job time for the fallback revoke if execution times out.
        timeout-minutes: 35
        env:
          ROTATE_FLAG: ${{ inputs.rotate_db_password && '--rotate-db-password' || '' }}
        run: |
          rotate=()
          if [ -n "$ROTATE_FLAG" ]; then rotate=("$ROTATE_FLAG"); fi
          python3 -I -B deploy/firebase/bootstrap/bootstrap.py \
            --execute \
            --expect-sha256 "$EXPECTED_SHA256" \
            --expect-commit "$EXPECTED_COMMIT" \
            "${rotate[@]}"

      - name: Revoke the sign-in (only when the execute step did not succeed)
        # The execute step revokes in its own process on success and on failure, and
        # its token is already spent. This step covers a run that died before it could,
        # and it is skipped after a clean execute, so a finished run cannot turn red here.
        if: always() && steps.auth.outcome == 'success' && steps.execute.outcome != 'success'
        env:
          ROTATE_FLAG: ${{ inputs.rotate_db_password && '--rotate-db-password' || '' }}
        run: |
          rotate=()
          if [ -n "$ROTATE_FLAG" ]; then rotate=("$ROTATE_FLAG"); fi
          python3 -I -B deploy/firebase/bootstrap/bootstrap.py --revoke-only \
            --expect-sha256 "$EXPECTED_SHA256" --expect-commit "$EXPECTED_COMMIT" \
            "${rotate[@]}"
