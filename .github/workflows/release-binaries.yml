name: Release Binaries
# Workflow triggers - tag push or manual dispatch

on:
  workflow_dispatch:
  repository_dispatch:
    types: [manual-release]
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  build:
    uses: ./.github/workflows/release-build.yml
    with:
      ref: ${{ github.event.client_payload.tag || github.ref }}
      version: ${{ github.event.client_payload.tag || github.ref_name }}

  proofs:
    needs: build
    uses: ./.github/workflows/release-proofs.yml
    with:
      version: ${{ github.event.client_payload.tag || github.ref_name }}

  release:
    needs: proofs
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/han-linux-x64/* release/
          cp artifacts/han-linux-arm64/* release/
          cp artifacts/han-darwin-x64/* release/
          cp artifacts/han-darwin-arm64/* release/
          cp artifacts/han-windows-x64/* release/
          echo "Release files:"
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.client_payload.tag || github.ref_name }}
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.event.client_payload.tag || github.ref, '-') }}

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.client_payload.tag || github.ref, '-') }}
    steps:
      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: TheBushidoCollective/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Checkout han repo for scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.tag || github.ref }}
          path: han

      - name: Update formula
        env:
          VERSION: ${{ github.event.client_payload.tag || github.ref_name }}
        run: |
          chmod +x han/.github/scripts/generate-homebrew-formula.sh
          han/.github/scripts/generate-homebrew-formula.sh "${VERSION}" > homebrew-tap/Formula/han.rb

      - name: Commit and push
        working-directory: homebrew-tap
        env:
          TAG: ${{ github.event.client_payload.tag || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/han.rb
          git commit -m "Update han to ${TAG}"
          git push

  publish-npm:
    needs: proofs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - artifact: han-linux-x64
            npm_platform: linux-x64
          - artifact: han-linux-arm64
            npm_platform: linux-arm64
          - artifact: han-darwin-x64
            npm_platform: darwin-x64
          - artifact: han-darwin-arm64
            npm_platform: darwin-arm64
          - artifact: han-windows-x64
            npm_platform: win32-x64
    steps:
      - name: Checkout for scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifact

      - name: Create npm package
        env:
          VERSION: ${{ github.event.client_payload.tag || github.ref_name }}
          PLATFORM: ${{ matrix.npm_platform }}
        run: |
          chmod +x .github/scripts/create-npm-platform-package.sh
          .github/scripts/create-npm-platform-package.sh "${VERSION}" "${PLATFORM}" "${{ matrix.artifact }}"

      - name: Publish to npm
        working-directory: package
        run: |
          TAG_FLAG="--tag latest"
          if [[ "${VERSION}" == *-* ]]; then
            TAG_FLAG="--tag next"
          fi
          npm publish --provenance --access public $TAG_FLAG
        env:
          VERSION: ${{ github.event.client_payload.tag || github.ref_name }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-wrapper:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout for scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Create wrapper package
        env:
          VERSION: ${{ github.event.client_payload.tag || github.ref_name }}
        run: |
          chmod +x .github/scripts/create-npm-wrapper-package.sh
          .github/scripts/create-npm-wrapper-package.sh "${VERSION}"

      - name: Publish wrapper to npm
        working-directory: package
        run: |
          TAG_FLAG="--tag latest"
          if [[ "${VERSION}" == *-* ]]; then
            TAG_FLAG="--tag next"
          fi
          npm publish --provenance --access public $TAG_FLAG
        env:
          VERSION: ${{ github.event.client_payload.tag || github.ref_name }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  dispatch-downstream:
    needs: [release, publish-wrapper]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Trigger website deployment and live verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Dispatching deploy-website.yml..."
          gh workflow run deploy-website.yml || true
          echo "Dispatching verify-live-release.yml..."
          gh workflow run verify-live-release.yml || true
