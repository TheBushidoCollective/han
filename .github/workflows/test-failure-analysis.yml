name: Test Failure Analysis

on:
  workflow_run:
    workflows: ["Test Website", "Auto Tag Release"]
    types: [completed]

# No token scope by default. The analysis job reads; the respond job writes.
permissions: {}

jobs:
  # Claude reads the failed run's logs. Those logs can carry text from the
  # branch under test, so this job holds no write scope. Only same-repository
  # branches are analysed: a fork author chooses the branch name.
  analyze:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      structured_output: ${{ steps.detect.outputs.structured_output }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Detect flaky test failures
        id: detect
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            The CI workflow failed: ${{ github.event.workflow_run.html_url }}

            Check the logs: gh run view ${{ github.event.workflow_run.id }} --log-failed

            Determine if this looks like a flaky test failure by checking for:
            - Timeout errors
            - Race conditions
            - Network errors
            - "Expected X but got Y" intermittent failures
            - Tests that passed in previous commits

            Return:
            - is_flaky: true if likely flaky, false if real bug
            - confidence: number 0-1 indicating confidence level
            - summary: brief one-sentence explanation
          claude_args: |
            --allowedTools "Bash(gh:*),Read,Grep"
            --json-schema '{"type":"object","properties":{"is_flaky":{"type":"boolean","description":"Whether this appears to be a flaky test failure"},"confidence":{"type":"number","minimum":0,"maximum":1,"description":"Confidence level in the determination"},"summary":{"type":"string","description":"One-sentence explanation of the failure"}},"required":["is_flaky","confidence","summary"]}'

  # Holds the write scopes. It never runs Claude and never checks out code. It
  # reads the analysis as data, validates its schema with jq, and acts on typed
  # values only.
  respond:
    needs: analyze
    if: needs.analyze.outputs.structured_output != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write        # gh run rerun --failed (one flaky retry per run)
      pull-requests: write  # comment on the pull request
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EVENT: ${{ github.event.workflow_run.event }}
      WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      STRUCTURED_OUTPUT: ${{ needs.analyze.outputs.structured_output }}
    steps:
      - name: Validate analysis
        id: verdict
        run: |
          set -euo pipefail
          if ! jq -e '
            type == "object" and
            (.is_flaky | type == "boolean") and
            (.confidence | type == "number" and . >= 0 and . <= 1) and
            (.summary | type == "string" and length <= 500)
          ' <<<"$STRUCTURED_OUTPUT" > /dev/null; then
            echo "::error::Analysis output did not match the expected schema; not acting on it"
            exit 1
          fi

          {
            echo "is_flaky=$(jq -r '.is_flaky' <<<"$STRUCTURED_OUTPUT")"
            echo "confidence=$(jq -r '.confidence' <<<"$STRUCTURED_OUTPUT")"
            echo "retry=$(jq -r 'if .is_flaky and .confidence >= 0.7 then "true" else "false" end' <<<"$STRUCTURED_OUTPUT")"
            echo "low_confidence=$(jq -r 'if .is_flaky and .confidence < 0.7 then "true" else "false" end' <<<"$STRUCTURED_OUTPUT")"
          } >> "$GITHUB_OUTPUT"

      - name: Retry flaky tests
        # One automatic rerun at most: a rerun raises run_attempt, and this
        # step only runs on the first attempt.
        if: steps.verdict.outputs.retry == 'true' && github.event.workflow_run.run_attempt < 2
        env:
          CONFIDENCE: ${{ steps.verdict.outputs.confidence }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          SUMMARY=$(jq -r '.summary' <<<"$STRUCTURED_OUTPUT")

          echo "🔄 Flaky test detected (confidence: $CONFIDENCE)"
          echo "Summary: $SUMMARY"
          echo ""
          echo "Rerunning the failed jobs of run $RUN_ID..."

          # gh workflow run only works for workflows with workflow_dispatch, and
          # the named workflows have none. Rerunning the failed run does not need it.
          gh run rerun "$RUN_ID" --failed --repo "$GH_REPO"

      - name: Low confidence detection
        if: steps.verdict.outputs.low_confidence == 'true'
        env:
          CONFIDENCE: ${{ steps.verdict.outputs.confidence }}
        run: |
          echo "⚠️ Possible flaky test but confidence too low ($CONFIDENCE)"
          echo "Not retrying automatically - manual review recommended"

      - name: Comment on PR
        if: github.event.workflow_run.event == 'pull_request'
        run: |
          set -euo pipefail
          IS_FLAKY="$(jq -r '.is_flaky' <<<"$STRUCTURED_OUTPUT")"
          SUMMARY=$(jq -r '.summary' <<<"$STRUCTURED_OUTPUT")

          # Only a pull request from this repository: gh matches by branch name
          # alone, and a fork can use the same name.
          pr_number=$(gh pr list --repo "$GH_REPO" --head "$HEAD_BRANCH" --json number,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository == false)][0].number // empty')

          if [ -z "$pr_number" ]; then
            echo "No same-repository pull request for $HEAD_BRANCH"
            exit 0
          fi

          if [ "$IS_FLAKY" = "true" ]; then
            TITLE="🔄 Flaky Test Detected"
            ACTION="✅ Automatically retrying the workflow"
          else
            TITLE="❌ Test Failure"
            ACTION="⚠️ This appears to be a real bug - manual intervention needed"
          fi

          body_file="$(mktemp)"
          {
            printf '## %s\n\n' "$TITLE"
            printf '**Analysis**: %s\n' "$SUMMARY"
            printf '**Confidence**: %s\n\n' "$(jq -r '.confidence' <<<"$STRUCTURED_OUTPUT")"
            printf '%s\n\n' "$ACTION"
            printf '[View workflow run](%s)\n' "$RUN_URL"
          } > "$body_file"

          gh pr comment "$pr_number" --body-file "$body_file"
