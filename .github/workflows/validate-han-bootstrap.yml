name: Validate Han Bootstrap

on:
  pull_request:
    paths:
      - 'deploy/firebase/bootstrap/**'
      - 'deploy/firebase/test/test_bootstrap.py'
      - 'deploy/firebase/test/test_bootstrap_execution.py'
      - 'deploy/firebase/test/test_auto_fix_security.py'
      - '.github/workflows/auto-fix-ci.yml'
      - '.github/workflows/han-bootstrap.yml'
      - '.github/workflows/validate-han-bootstrap.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/firebase/bootstrap/**'
      - 'deploy/firebase/test/test_bootstrap.py'
      - 'deploy/firebase/test/test_bootstrap_execution.py'
      - 'deploy/firebase/test/test_auto_fix_security.py'
      - '.github/workflows/auto-fix-ci.yml'
      - '.github/workflows/han-bootstrap.yml'
      - '.github/workflows/validate-han-bootstrap.yml'

permissions:
  contents: read

jobs:
  bootstrap-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python3 -m pip install 'pyyaml==6.0.2'
      # This staging PR contains the bootstrap only, not the infrastructure
      # workflows, Terraform, or hosting scripts. Their integration tests run
      # on the complete platform PR. The classes below exercise the bootstrap
      # itself, including plan provenance, IAM preflight, failure and revoke.
      - name: Bootstrap plan and guarded execution tests
        env:
          PYTHONPATH: deploy/firebase/test
        run: |
          python3 -B -m unittest -v \
            test_bootstrap.PlanMode test_bootstrap.FirstRun \
            test_bootstrap.IdempotentSecondRun test_bootstrap.NotFoundClassification \
            test_bootstrap.Revoke test_bootstrap.PrincipalCoverage test_bootstrap.CapableMembers \
            test_bootstrap.PolicyReadRetry test_bootstrap.FlagsAreCaptured test_bootstrap.RoleFiles \
            test_bootstrap.DatabasePasswordSequence test_bootstrap.CloudSdkFileLoggingIsOff \
            test_bootstrap.CiOnly test_bootstrap.SignInProvenance test_bootstrap.StateBucketIsOurs \
            test_bootstrap.WorkflowIsAnInput test_bootstrap.ExecutionBoundary
      - name: Per-execution identity negative controls
        run: python3 -B -m unittest discover -s deploy/firebase/test -p test_bootstrap_execution.py -v
      - name: Authenticate auto-fix sources
        run: python3 -B -m unittest discover -s deploy/firebase/test -p test_auto_fix_security.py -v
      - name: Publish bootstrap plan for review
        run: python3 -I -B deploy/firebase/bootstrap/bootstrap.py --plan-file bootstrap-plan.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bootstrap-plan
          path: bootstrap-plan.txt
          retention-days: 7
      - name: Publish rotation plan for review
        run: python3 -I -B deploy/firebase/bootstrap/bootstrap.py --rotate-db-password --plan-file bootstrap-rotation-plan.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bootstrap-rotation-plan
          path: bootstrap-rotation-plan.txt
          retention-days: 7
          if-no-files-found: error
