name: Publish MCP Servers
# Publishes the MCP server packages under packages/ (mcp-server-reddit, ...)
# to npm when their package.json version has not been published yet.
# Triggered by pushes to main that touch a server, or manually.
#
# Auth: npm Trusted Publishing (OIDC). No NPM_TOKEN secret required.
# Each package must have a trusted publisher configured on npmjs.com:
#   org/user: thebushidocollective
#   repo:     thebushidocollective/han
#   workflow: publish-mcp-servers.yml

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/mcp-server-*/package.json"
      - "packages/mcp-server-*/src/**"
      - ".github/workflows/publish-mcp-servers.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing + provenance
    strategy:
      fail-fast: false
      matrix:
        server: [mcp-server-reddit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Read package metadata
        id: pkg
        working-directory: packages/${{ matrix.server }}
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if version already published
        id: check
        env:
          PKG_NAME: ${{ steps.pkg.outputs.name }}
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          if npm view "$PKG_NAME@$PKG_VERSION" version --registry https://registry.npmjs.org 2>/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$PKG_NAME@$PKG_VERSION already on npm, skipping"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.published == 'false'
        working-directory: packages/${{ matrix.server }}
        run: npm install --no-audit --no-fund

      - name: Build
        if: steps.check.outputs.published == 'false'
        working-directory: packages/${{ matrix.server }}
        run: npm run build

      # npm CLI 11.5.1+ (bundled with Node 24) detects the GitHub Actions
      # OIDC token and publishes via trusted publishing automatically when
      # no auth token is configured. Provenance is implied.
      - name: Publish to npm
        if: steps.check.outputs.published == 'false'
        working-directory: packages/${{ matrix.server }}
        run: |
          npm --version
          npm publish --access public
