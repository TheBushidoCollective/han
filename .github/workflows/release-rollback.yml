name: Release Rollback

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Target git ref to roll back to (commit SHA or tag)"
        required: true
      target_version:
        description: "Target version to restore (e.g. 3.22.0)"
        required: true
      dry_run:
        description: "Dry run (simulate without mutating live release/npm)"
        type: boolean
        required: true
        default: true

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: protected-release
    steps:
      - name: Checkout rollback tools
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Plan rollback
        run: |
          echo "=== Rollback Plan ==="
          echo "Target ref: ${{ inputs.target_ref }}"
          echo "Target version: ${{ inputs.target_version }}"
          echo "Dry run: ${{ inputs.dry_run }}"

      - name: Execute rollback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          chmod +x ./.github/scripts/release-rollback.sh
          ./.github/scripts/release-rollback.sh "${{ inputs.target_version }}" "${{ inputs.dry_run }}"
