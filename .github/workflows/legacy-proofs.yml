name: Legacy Proofs

on:
  workflow_call:
    inputs:
      version:
        description: "Release version being proved"
        type: string
        required: false
        default: "3.23.0"

jobs:
  legacy-proofs:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: han-linux-x64
            binary_name: han-linux-x64
            coordinator_binary: han-coordinator-linux-x64
          - os: ubuntu-24.04-arm
            artifact: han-linux-arm64
            binary_name: han-linux-arm64
            coordinator_binary: han-coordinator-linux-arm64
          - os: macos-latest
            artifact: han-darwin-arm64
            binary_name: han-darwin-arm64
            coordinator_binary: han-coordinator-darwin-arm64
          - os: macos-15-intel
            artifact: han-darwin-x64
            binary_name: han-darwin-x64
            coordinator_binary: han-coordinator-darwin-x64
          - os: windows-latest
            artifact: han-windows-x64
            binary_name: han-windows-x64.exe
            coordinator_binary: han-coordinator-windows-x64.exe

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        uses: taiki-e/install-action@v2
        with:
          tool: protoc

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/

      - name: Setup test binaries
        shell: bash
        run: |
          mkdir -p bin
          suffix=""
          if [[ "${{ matrix.os }}" == *windows* ]]; then suffix=".exe"; fi
          cp "artifacts/${{ matrix.binary_name }}" "bin/han${suffix}"
          cp "artifacts/${{ matrix.coordinator_binary }}" "bin/han-coordinator${suffix}"
          chmod +x bin/* 2>/dev/null || true
          echo "${{ github.workspace }}/bin" >> $GITHUB_PATH
          echo "HAN_INSTALLED_BIN=${{ github.workspace }}/bin/han${suffix}" >> $GITHUB_ENV

      - name: Run legacy_identity unit tests
        working-directory: packages/han-rs
        run: cargo test --locked -p han-coordinator --test legacy_identity

      - name: Run legacy upgrade proof
        run: bun packages/han/scripts/release-proof/prove-legacy-upgrade.ts

      - name: Run legacy negative proof
        run: bun packages/han/scripts/release-proof/prove-legacy-negative.ts

      - name: Run legacy mutations proof
        run: bun packages/han/scripts/release-proof/prove-legacy-mutations.ts "all"
