name: Deploy Han Hosting

# Builds the dashboard and app bundles from packages/browse-client and deploys
# them to Firebase Hosting. Same trigger model, and the same verify-source gate, as deploy-han-server.yml.
#
# - dashboard: built with no GRAPHQL_URL. The bundle carries no API address.
# - app: built with GRAPHQL_URL=https://api.han.guru/graphql.

on:
  pull_request:
    paths:
      - "packages/browse-client/**"
      - "deploy/firebase/**"
      - ".github/workflows/deploy-hosting.yml"
  workflow_run:
    workflows: ["Han Infrastructure"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-hosting-pr-{0}', github.event.number) || 'deploy-hosting-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-source:
    # The trigger gate. Every job that builds or deploys waits for it.
    # It refuses unless the infra run that triggered this is the Han Infrastructure
    # workflow file, a push to main, from this repository, and its commit is an
    # ancestor of origin/main. A tag or branch named main, a fork, or another
    # workflow with the same name is refused. Git failures fail closed.
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history and every branch, so origin/main exists for the ancestry check.
          # Credentials stay persisted so the fetch below uses this repository's token.
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify the trigger and the commit
        shell: bash
        env:
          WR_PATH: ${{ github.event.workflow_run.path }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          if [ "$WR_PATH" != ".github/workflows/han-infra.yml" ]; then
            fail "Trigger is '$WR_PATH', not .github/workflows/han-infra.yml"
          fi
          if [ "$WR_EVENT" != "push" ]; then fail "Trigger event is '$WR_EVENT', not push"; fi
          if [ "$WR_CONCLUSION" != "success" ]; then fail "Infra run concluded '$WR_CONCLUSION'"; fi
          if [ "$WR_BRANCH" != "main" ]; then fail "Trigger branch is '$WR_BRANCH', not main"; fi
          if [ -z "$REPO" ] || [ "$WR_HEAD_REPO" != "$REPO" ]; then
            fail "Trigger repository '$WR_HEAD_REPO' is not '$REPO'"
          fi
          if ! [[ "$WR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            fail "Trigger head '$WR_HEAD_SHA' is not a full commit SHA"
          fi
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            # A shallow checkout has no origin/main history to test against.
            git fetch --no-tags --unshallow origin '+refs/heads/main:refs/remotes/origin/main'
          else
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          fi
          main_sha="$(git rev-parse --verify --quiet 'refs/remotes/origin/main^{commit}')" \
            || fail "origin/main did not resolve after the fetch"
          git cat-file -e "$WR_HEAD_SHA^{commit}" 2>/dev/null \
            || fail "Trigger commit $WR_HEAD_SHA is not in this repository"
          rc=0
          git merge-base --is-ancestor "$WR_HEAD_SHA" "$main_sha" || rc=$?
          case "$rc" in
            0) echo "Trigger commit $WR_HEAD_SHA is an ancestor of origin/main $main_sha" ;;
            1) fail "Trigger commit $WR_HEAD_SHA is not an ancestor of origin/main $main_sha" ;;
            *) fail "git could not compare $WR_HEAD_SHA with origin/main (exit $rc)" ;;
          esac

  build:
    needs: verify-source
    if: always() && (github.event_name == 'pull_request' || (needs.verify-source.result == 'success' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/browse-client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.2"
          # The Bun executable is not cached. A shared cache could supply the binary that builds production.
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2
        with:
          # Same version as packages/browse-client/package.json.
          version: 2.3.7

      - name: Lint
        run: biome lint --files-ignore-unknown=true .

      - name: Relay compiler check
        run: bun run relay

      - name: Type check
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      - name: Build dashboard (no API address)
        run: |
          unset GRAPHQL_URL
          bun run build
          rm -rf "$GITHUB_WORKSPACE/deploy/firebase/build/dashboard"
          mkdir -p "$GITHUB_WORKSPACE/deploy/firebase/build/dashboard"
          cp -R out/. "$GITHUB_WORKSPACE/deploy/firebase/build/dashboard/"

      - name: Build app (API address)
        env:
          HAN_BUILD_TARGET: team-app
          GRAPHQL_URL: https://api.han.guru/graphql
        run: |
          bun run build
          rm -rf "$GITHUB_WORKSPACE/deploy/firebase/build/app"
          mkdir -p "$GITHUB_WORKSPACE/deploy/firebase/build/app"
          cp -R out/. "$GITHUB_WORKSPACE/deploy/firebase/build/app/"

      - name: Check bundles carry the right API address
        run: |
          set -euo pipefail
          build="$GITHUB_WORKSPACE/deploy/firebase/build"
          grep -rq "https://api.han.guru/graphql" "$build/app"
          if grep -rq "api.han.guru" "$build/dashboard"; then
            echo "::error::dashboard bundle contains an API address"
            exit 1
          fi
          echo "bundle checks passed"

      - name: Upload builds
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: han-hosting-build
          path: deploy/firebase/build
          retention-days: 7

  deploy:
    needs: [build, verify-source]
    # success() is written out. GitHub would apply it by default, but naming it keeps the gate dependence visible here.
    if: success() && github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: han-hosting
      url: https://app.han.guru
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: deploy/firebase
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: han-hosting-build
          path: deploy/firebase/build

      - name: Authenticate to Google Cloud (WIF, hosting deployer)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.HAN_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.HAN_GCP_HOSTING_DEPLOYER_SA }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Write .firebaserc for the configured project
        env:
          PROJECT_ID: ${{ vars.HAN_GCP_PROJECT_ID }}
        run: python3 scripts/firebaserc.py "$PROJECT_ID"

      - name: Install the pinned Firebase CLI
        # Lockfile-pinned, and no install scripts run.
        run: npm ci --ignore-scripts

      - name: Ensure the Hosting sites exist (create missing only)
        env:
          PROJECT_ID: ${{ vars.HAN_GCP_PROJECT_ID }}
        run: python3 scripts/ensure_hosting_sites.py "$PROJECT_ID"

      - name: Deploy dashboard, app and the api rewrite
        # All three targets. The api rewrite is static, so this is idempotent,
        # and this is the only workflow that deploys Hosting. The server deploy
        # does not touch it.
        env:
          PROJECT_ID: ${{ vars.HAN_GCP_PROJECT_ID }}
        run: npx --no-install firebase deploy --only hosting:api,hosting:dashboard,hosting:app --project "$PROJECT_ID" --non-interactive

      - name: Read-only checks on the default sites
        run: |
          set -euo pipefail
          # Site IDs are fixed in deploy/firebase/terraform/main.tf.
          for site in han-guru-dashboard han-guru-app; do
            url="https://${site}.web.app"
            root="$(curl -fsS --retry 5 --retry-delay 5 "$url/")"
            deep="$(curl -sS -o /dev/null -w '%{http_code}' "$url/some/deep/link")"
            [ "$deep" = "200" ] || { echo "::error::$url deep link returned $deep"; exit 1; }
            entry="$(printf '%s' "$root" | grep -o 'src="/[^"]*\.js"' | head -n1 | sed 's/^src="//;s/"$//')"
            [ -n "$entry" ] || { echo "::error::no entry script in $url"; exit 1; }
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$url$entry")"
            [ "$code" = "200" ] || { echo "::error::$url$entry returned $code"; exit 1; }
          done
          echo "hosting checks passed"

      - name: Read-only checks on the api host
        run: |
          set -euo pipefail
          site="https://han-guru-api.web.app"
          health="$(curl -fsS --retry 5 --retry-delay 5 "$site/health")"
          printf '%s' "$health" | jq -e 'has("service") and has("status")' >/dev/null
          location="$(curl -sS -o /dev/null -w '%{redirect_url}' "$site/auth/github")"
          python3 scripts/check_redirect.py "$location" "$GITHUB_CLIENT_ID" \
            "https://api.han.guru/auth/github/callback"
        env:
          GITHUB_CLIENT_ID: ${{ vars.HAN_GITHUB_CLIENT_ID }}
