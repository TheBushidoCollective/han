name: Validate Han Deploy

# Runs the deploy-path checks on every change to the deploy tree, so they are
# enforced in CI and not only locally:
#   - the Python policy and behaviour tests in deploy/firebase/test
#   - Terraform format and validation (no backend, no credentials)
#   - actionlint on every workflow
#
# This workflow has no cloud identity and no environment.

on:
  pull_request:
    paths:
      - "deploy/firebase/**"
      - ".github/workflows/**"
      - "packages/han-rs/**"
  push:
    branches: [main]
    paths:
      - "deploy/firebase/**"
      - ".github/workflows/**"
      - "packages/han-rs/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('validate-deploy-pr-{0}', github.event.number) || 'validate-deploy-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python3 -m pip install "pyyaml==6.0.2"
      - name: Deploy policy and behaviour tests
        run: python3 -B -m unittest discover -s deploy/firebase/test -v

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/firebase/terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.8
      - name: Format
        run: terraform fmt -check -recursive
      - name: Validate (no backend, no credentials)
        run: |
          terraform init -backend=false -input=false
          terraform validate

  dns-import-terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/firebase/dns-import
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.8
      - run: terraform fmt -check -recursive
      - run: |
          terraform init -backend=false -input=false
          terraform validate

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          # The action defaults to "latest". Pin it so a new release cannot
          # change what passes review.
          version: "1.7.7"
          fail-on-error: true
