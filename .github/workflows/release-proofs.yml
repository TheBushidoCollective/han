name: Release Proofs

on:
  workflow_call:
    inputs:
      version:
        description: "Release version being proved"
        type: string
        required: false
        default: "3.23.0"

jobs:
  native-proofs:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: han-linux-x64
            binary_name: han-linux-x64
            coordinator_binary: han-coordinator-linux-x64
          - os: ubuntu-24.04-arm
            artifact: han-linux-arm64
            binary_name: han-linux-arm64
            coordinator_binary: han-coordinator-linux-arm64
          - os: macos-latest
            artifact: han-darwin-arm64
            binary_name: han-darwin-arm64
            coordinator_binary: han-coordinator-darwin-arm64
          - os: macos-15-intel
            artifact: han-darwin-x64
            binary_name: han-darwin-x64
            coordinator_binary: han-coordinator-darwin-x64
          - os: windows-latest
            artifact: han-windows-x64
            binary_name: han-windows-x64.exe
            coordinator_binary: han-coordinator-windows-x64.exe

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/

      - name: Install dependencies for proof runners
        shell: bash
        run: |
          cd packages/han
          bun install --frozen-lockfile
          cd ../browse-client
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: 1. Prove Installer
        shell: bash
        run: |
          chmod +x artifacts/* 2>/dev/null || true
          bun packages/han/scripts/release-proof/prove-installer.ts

      - name: 2. Prove Installed Coordinator
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == *windows* ]]; then
            bun packages/han/scripts/prove-installed-windows-coordinator.ts
          else
            bun packages/han/scripts/prove-installed-coordinator.ts
          fi

      - name: 3. Prove Installed Hooks
        shell: bash
        run: |
          bun packages/han/scripts/release-proof/prove-installed-hooks.ts

      - name: 4. Browser Transport against Installed Binary
        shell: bash
        run: |
          suffix=""
          if [[ "${{ matrix.os }}" == *windows* ]]; then suffix=".exe"; fi
          INSTALLED_CLI="${{ github.workspace }}/artifacts/${{ matrix.binary_name }}"
          cd packages/browse-client
          HAN_TRANSPORT_CLI="$INSTALLED_CLI" bunx playwright test --config playwright.transport.config.ts

      - name: 5. Prove Legacy Upgrade
        shell: bash
        run: |
          bun packages/han/scripts/release-proof/prove-legacy-upgrade.ts

      - name: 6. Leak Check
        shell: bash
        run: |
          echo "Checking for leaked coordinator or han processes..."
          if [[ "${{ matrix.os }}" == *windows* ]]; then
            tasklist | grep -iE 'han(-coordinator)?\.exe' || echo "No leaked processes found."
          else
            pgrep -fl 'han(-coordinator)?' || echo "No leaked processes found."
          fi
